<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogos para Descarga | EMBAIR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-embair-blue { background-color: #0A2647; }
    .text-embair-orange { color: #FF6600; }
    .bg-embair-orange { background-color: #FF6600; }
  </style>
</head>
<body class="bg-gray-50 text-slate-900 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-embair-blue text-white shadow-xl">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <span class="text-2xl font-black tracking-tighter italic">EMBAIR</span>
      <a href="/" class="text-xs md:text-sm text-gray-300 hover:text-white transition font-bold">Volver al inicio</a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-4xl mx-auto px-4 py-12 w-full flex-1">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-embair-blue mb-2">Catálogos para Descarga</h2>
      <p class="text-sm text-gray-600">Aquí encontrarás los catálogos y listas de precios actualizadas en formato PDF.</p>
    </div>

    <!-- Tabla Dinámica de Catálogos -->
    <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-xs uppercase text-slate-600 font-bold tracking-wider">
              <th class="py-4 px-6">Nombre del Documento</th>
              <th class="py-4 px-6 text-right">Acción</th>
            </tr>
          </thead>
          <tbody id="catalogs-table-body" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="2" class="py-6 text-center text-slate-400">Cargando catálogos autorizados...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
    <p>© 2026 COMERCIALIZADORA EMBAIR. Todos los derechos reservados.</p>
  </footer>

  <script>
    const SESSION_KEY = "embair_session_id"

    // 1. Verificación de Registro / Sesión al entrar a la página
    async function checkUserAccess() {
      const sessionId = localStorage.getItem(SESSION_KEY)
      
      // Si no hay sesión en el navegador, redirige a la landing principal para que se registre en el asistente
      if (!sessionId) {
        window.location.href = "/"
        return
      }

      try {
        // Valida en el backend si el usuario ya está dado de alta
        const res = await fetch("/api/auth/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId })
        })
        const data = await res.json()

        if (!data.exists) {
          // Si el registro no es válido, redirige al inicio
          window.location.href = "/"
        } else {
          // Si está registrado, carga los catálogos reales
          loadCatalogs()
        }
      } catch (e) {
        // Ante cualquier fallo de red, por seguridad mandamos al inicio o dejamos cargar si prefieres
        loadCatalogs()
      }
    }

    // 2. Cargar únicamente los catálogos subidos en el sistema
    async function loadCatalogs() {
      const tbody = document.getElementById("catalogs-table-body")
      try {
        const res = await fetch("/api/catalogs") // Endpoint que lee los catálogos subidos
        if (!res.ok) throw new Error("No se pudieron cargar")
        
        const catalogs = await res.json()
        tbody.innerHTML = ""

        if (!Array.isArray(catalogs) || catalogs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="2" class="py-8 text-center text-slate-400 text-xs">No hay catálogos disponibles en este momento.</td></tr>`
          return
        }

        catalogs.forEach(cat => {
          const row = document.createElement("tr")
          row.className = "hover:bg-slate-50 transition"
          row.innerHTML = `
            <td class="py-4 px-6 font-semibold text-slate-800 flex items-center gap-2">
              <span>📄</span> ${cat.name || cat.filename}
            </td>
            <td class="py-4 px-6 text-right">
              <a href="${cat.url || cat.path}" target="_blank" class="bg-embair-blue hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-sm inline-flex items-center gap-1.5">
                <span>⬇️</span> Descargar
              </a>
            </td>
          `
          tbody.appendChild(row)
        })
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="2" class="py-8 text-center text-red-400 text-xs">Error al sincronizar los documentos.</td></tr>`
      }
    }

    document.addEventListener("DOMContentLoaded", checkUserAccess)
  </script>
</body>
</html>
