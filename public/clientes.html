<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-3">
        <div class="relative w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold overflow-hidden">
          <img id="admin-logo" src="/uploads/logo.png" class="absolute inset-0 w-full h-full object-contain bg-white hidden" onerror="this.classList.add('hidden')">
          <span>ME</span>
        </div>
        <div>
          <h1 class="text-2xl font-semibold">Gestión de Clientes</h1>
          <p class="text-xs text-gray-500">Altas, edición, listado y exportación de clientes.</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <a href="/admin.html" class="text-sm text-gray-600 hover:text-gray-900">Panel principal</a>
        <a href="/productos.html" class="text-sm text-blue-600 hover:text-blue-800">Gestión de productos</a>
        <a href="/" class="text-sm text-gray-600 hover:text-gray-900">Volver a la tienda</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">Clientes</h2>
      <div class="flex items-center gap-3">
        <select id="client-type-filter" class="border rounded px-3 py-2 text-sm">
          <option value="">Todos los tipos</option>
          <option value="Particular">Particular</option>
          <option value="Instalador">Instalador</option>
        </select>
        <input id="client-search" placeholder="Buscar por nombre, cédula o teléfono" class="border rounded px-3 py-2 text-sm" />
        <button id="export-clients" class="bg-gray-800 text-white rounded px-3 py-2 text-sm">Exportar clientes (Excel)</button>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <form id="client-form" class="grid sm:grid-cols-3 gap-4">
        <input type="hidden" id="client-id" />
        <div>
          <label class="block text-sm mb-1">Nombre</label>
          <input id="client-nombre" class="w-full border rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm mb-1">Apellido</label>
          <input id="client-apellido" class="w-full border rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm mb-1">Cédula</label>
          <input id="client-cedula" class="w-full border rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm mb-1">Correo Electrónico</label>
          <input id="client-email" type="email" class="w-full border rounded px-3 py-2 text-sm" placeholder="cliente@email.com" />
        </div>
        <div>
          <label class="block text-sm mb-1">Dirección</label>
          <input id="client-direccion" class="w-full border rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm mb-1">Zona / Sector</label>
          <input id="client-zona" class="w-full border rounded px-3 py-2 text-sm" placeholder="Ej: Centro, Norte, Sur" />
        </div>
        <div>
          <label class="block text-sm mb-1">Celular</label>
          <input id="client-celular" class="w-full border rounded px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm mb-1">Tipo de cliente</label>
          <select id="client-tipo" class="w-full border rounded px-3 py-2 text-sm">
            <option value="">Selecciona tipo</option>
            <option value="Particular">Particular</option>
            <option value="Instalador">Instalador</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1">Clave portal (solo EMBAIR)</label>
          <div class="flex gap-2">
            <input id="client-portal-pass" type="text" autocomplete="off" class="flex-1 border rounded px-3 py-2 text-sm" placeholder="Dejar vacío para no cambiar" />
            <button id="generate-portal-pass" type="button" class="border border-gray-300 rounded px-3 py-2 text-xs whitespace-nowrap">Generar</button>
            <button id="portal-pass-pdf" type="button" class="border border-gray-300 rounded px-3 py-2 text-xs whitespace-nowrap">Recibo PDF</button>
          </div>
        </div>
        <div class="sm:col-span-3 flex gap-3 mt-2">
          <button id="save-client" class="bg-blue-600 text-white rounded px-4 py-2 text-sm">Guardar cliente</button>
          <button id="reset-client" type="button" class="border border-gray-300 rounded px-4 py-2 text-sm">Limpiar</button>
        </div>
      </form>
    </div>
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-gray-100 text-left">
            <th class="px-3 py-2">Nombre y apellido</th>
            <th class="px-3 py-2">Cédula</th>
            <th class="px-3 py-2">Tipo</th>
            <th class="px-3 py-2">Pedidos</th>
            <th class="px-3 py-2">Celular</th>
            <th class="px-3 py-2">Zona</th>
            <th class="px-3 py-2">Dirección</th>
            <th class="px-3 py-2">Portal</th>
            <th class="px-3 py-2">Acciones</th>
          </tr>
        </thead>
        <tbody id="client-rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const clientRowsEl = document.getElementById("client-rows")
    const clientFormEl = document.getElementById("client-form")
    const clientIdEl = document.getElementById("client-id")
    const clientNombreEl = document.getElementById("client-nombre")
    const clientApellidoEl = document.getElementById("client-apellido")
    const clientCedulaEl = document.getElementById("client-cedula")
    const clientEmailEl = document.getElementById("client-email")
    const clientDireccionEl = document.getElementById("client-direccion")
    const clientZonaEl = document.getElementById("client-zona")
    const clientCelularEl = document.getElementById("client-celular")
    const clientTipoEl = document.getElementById("client-tipo")
    const clientPortalPassEl = document.getElementById("client-portal-pass")
    const generatePortalPassBtn = document.getElementById("generate-portal-pass")
    const portalPassPdfBtn = document.getElementById("portal-pass-pdf")

    function generatePortalPassword() {
      const base = Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, "")
      const part1 = base.slice(0, 4) || "EMBA"
      const part2 = base.slice(4, 8) || "1234"
      return part1 + "-" + part2
    }

    function getNextPortalReceiptNumber() {
      try {
        const raw = localStorage.getItem("portalReceiptCounter") || "0"
        let n = parseInt(raw, 10)
        if (!Number.isFinite(n) || n < 0) n = 0
        n += 1
        localStorage.setItem("portalReceiptCounter", String(n))
        return n
      } catch {
        return Date.now()
      }
    }

    if (generatePortalPassBtn && clientPortalPassEl) {
      generatePortalPassBtn.addEventListener("click", () => {
        clientPortalPassEl.value = generatePortalPassword()
      })
    }
    function generatePortalAccessPdf() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("No se pudo cargar el generador de PDF.")
        return
      }
      const pass = clientPortalPassEl ? clientPortalPassEl.value.trim() : ""
      if (!pass) {
        alert("Primero genera o escribe una clave de portal.")
        return
      }
      const nombre = clientNombreEl.value.trim()
      const apellido = clientApellidoEl.value.trim()
      const cedula = clientCedulaEl.value.trim()
      const email = clientEmailEl.value.trim()
      const celular = clientCelularEl.value.trim()
      const zona = clientZonaEl.value.trim()
      const tipo = clientTipoEl.value
      const receiptNumber = getNextPortalReceiptNumber()
      const receiptCode = ("00000" + receiptNumber).slice(-5)
      const doc = new window.jspdf.jsPDF()
      let y = 15
      doc.setFontSize(14)
      doc.text("Acceso al Portal de Clientes EMBAIR", 10, y)
      y += 8
      doc.setFontSize(11)
      doc.text("Recibo N\u00b0 " + receiptCode, 10, y)
      y += 7
      doc.setFontSize(10)
      const nowStr = new Date().toLocaleString()
      doc.text("Fecha: " + nowStr, 10, y)
      y += 6
      const nombreLinea = "Cliente: " + (nombre || "") + " " + (apellido || "")
      doc.text(nombreLinea.trim(), 10, y)
      y += 5
      if (cedula) {
        doc.text("Cédula: " + cedula, 10, y)
        y += 5
      }
      if (celular) {
        doc.text("Celular / WhatsApp: " + celular, 10, y)
        y += 5
      }
      if (zona) {
        doc.text("Zona: " + zona, 10, y)
        y += 5
      }
      if (tipo) {
        doc.text("Tipo de cliente: " + tipo, 10, y)
        y += 6
      } else {
        y += 4
      }
      const portalUrl = window.location.origin + "/app?portal=1"
      doc.text("URL de acceso al portal:", 10, y)
      y += 5
      doc.text(portalUrl, 10, y)
      y += 6
      if (email) {
        doc.text("Usuario (correo): " + email, 10, y)
        y += 5
      }
      doc.text("Clave de acceso: " + pass, 10, y)
      y += 8
      doc.text("Guarda este recibo en un lugar seguro.", 10, y)
      y += 5
      doc.text("Si tienes problemas para ingresar, cont\u00e1ctanos por WhatsApp.", 10, y)
      const fileName = "Recibo_Portal_EMBAIR_" + receiptCode + "_" + (cedula || Date.now()) + ".pdf"
      doc.save(fileName)
      alert("Se gener\u00f3 el recibo PDF de acceso (" + fileName + "). Ahora se abrir\u00e1 WhatsApp para que lo env\u00edes adjunto.")
      if (celular) {
        const num = celular.replace(/\D/g, "")
        const saludo = nombre ? "Hola " + nombre + ", " : "Hola, "
        const texto = saludo + "te estamos enviando tu acceso al Portal de Clientes EMBAIR en un recibo PDF. Por favor revisa el archivo adjunto para ver tu usuario y clave."
        const url = "https://wa.me/" + num + "?text=" + encodeURIComponent(texto)
        window.open(url, "_blank")
      } else {
        alert("No hay un n\u00famero de WhatsApp en el formulario. El PDF se gener\u00f3 correctamente; adj\u00fantalo al chat manualmente.")
      }
    }
    if (portalPassPdfBtn) {
      portalPassPdfBtn.addEventListener("click", () => {
        generatePortalAccessPdf()
      })
    }
    const clientTypeFilterEl = document.getElementById("client-type-filter")
    const clientSearchEl = document.getElementById("client-search")
    const clientSaveBtn = document.getElementById("save-client")
    const clientResetBtn = document.getElementById("reset-client")
    const exportClientsBtn = document.getElementById("export-clients")

    function getAdminToken() {
      try {
        const saved = localStorage.getItem("admin_token")
        if (saved) return saved
      } catch {}
      return ""
    }

    async function fetchAdmin(path, options) {
      const token = getAdminToken()
      const baseHeaders = options && options.headers ? options.headers : {}
      const headers = token ? { ...baseHeaders, "Authorization": "Basic " + token } : baseHeaders
      const res = await fetch(path, { ...(options || {}), headers })
      if (res.status !== 401 && res.status !== 403) return res
      const newToken = prompt("Credenciales requeridas. Ingrese user:pass:")
      if (!newToken) return res
      try { localStorage.setItem("admin_token", btoa(newToken)) } catch {}
      const headers2 = { ...(options && options.headers ? options.headers : {}), "Authorization": "Basic " + btoa(newToken) }
      return fetch(path, { ...(options || {}), headers: headers2 })
    }

    async function loadClients() {
      try {
        const res = await fetchAdmin("/api/clients")
        if (res.ok) {
          const arr = await res.json()
          if (Array.isArray(arr) && arr.length > 0) {
            return arr
          }
          const raw = localStorage.getItem("clients")
          const local = raw ? JSON.parse(raw) : []
          if (Array.isArray(local) && local.length > 0) {
            saveClients(local)
            return local
          }
          return []
        }
      } catch {}
      try {
        const raw = localStorage.getItem("clients")
        const arr = raw ? JSON.parse(raw) : []
        return Array.isArray(arr) ? arr : []
      } catch {
        return []
      }
    }

    async function saveClients(list) {
      localStorage.setItem("clients", JSON.stringify(list))
      try {
        await fetchAdmin("/api/clients", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(list)
        })
      } catch (e) {
        console.error("Failed to sync clients", e)
      }
    }

    let CLIENTS = []
    loadClients().then(c => {
      CLIENTS = c
      renderClients()
    })

    function renderClients() {
      const typeFilter = clientTypeFilterEl.value || ""
      const q = (clientSearchEl.value || "").toLowerCase()
      const items = CLIENTS.filter(c => {
        const okType = typeFilter ? c.tipo === typeFilter : true
        const text = `${c.nombre || ""} ${c.apellido || ""} ${c.cedula || ""} ${c.celular || ""} ${c.zona || ""}`.toLowerCase()
        const okSearch = q ? text.includes(q) : true
        return okType && okSearch
      })
      clientRowsEl.innerHTML = ""
      for (const c of items) {
        const tr = document.createElement("tr")
        const nombre = `${c.nombre || ""} ${c.apellido || ""}`.trim()
        let portalLabel = "Sin portal"
        if (c.portalApproved) {
          portalLabel = "Aprobado"
          if (typeof c.portalLoginCount === "number" && c.portalLoginCount > 0) {
            portalLabel += ` (${c.portalLoginCount} login${c.portalLoginCount > 1 ? "s" : ""})`
          }
        } else if (c.portalRequestedAt) {
          portalLabel = "Pendiente"
        }
        tr.innerHTML = `
          <td class="px-3 py-2">${nombre}</td>
          <td class="px-3 py-2">${c.cedula || ""}</td>
          <td class="px-3 py-2">${c.tipo || ""}</td>
          <td class="px-3 py-2">${typeof c.pedidos === "number" ? c.pedidos : 0}</td>
          <td class="px-3 py-2">${c.celular || ""}</td>
          <td class="px-3 py-2">${c.zona || ""}</td>
          <td class="px-3 py-2">${c.direccion || ""}</td>
          <td class="px-3 py-2">${portalLabel}</td>
          <td class="px-3 py-2">
            <button data-id="${c.id}" data-action="wa" class="bg-emerald-500 text-white px-2 py-1 rounded mr-2 text-xs">WhatsApp</button>
            <button data-id="${c.id}" data-action="edit" class="bg-blue-600 text-white px-2 py-1 rounded mr-2 text-xs">Editar</button>
            <button data-id="${c.id}" data-action="del" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Eliminar</button>
          </td>
        `
        clientRowsEl.appendChild(tr)
      }
      clientRowsEl.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-id"))
          const action = btn.getAttribute("data-action")
          if (action === "edit") {
            const c = CLIENTS.find(x => x.id === id)
            if (!c) return
            clientIdEl.value = String(c.id)
            clientNombreEl.value = c.nombre || ""
            clientApellidoEl.value = c.apellido || ""
            clientCedulaEl.value = c.cedula || ""
            clientEmailEl.value = c.email || ""
            clientDireccionEl.value = c.direccion || ""
            clientCelularEl.value = c.celular || ""
            clientZonaEl.value = c.zona || ""
            clientTipoEl.value = c.tipo || ""
            if (clientPortalPassEl) clientPortalPassEl.value = ""
            window.scrollTo({ top: 0, behavior: "smooth" })
          } else if (action === "wa") {
            const c = CLIENTS.find(x => x.id === id)
            if (c && c.celular) {
              const num = c.celular.replace(/\D/g, "")
              const saludo = c.nombre ? `Hola ${c.nombre}, ` : "Hola, "
              const texto = saludo + "te estamos enviando tu acceso al Portal de Clientes EMBAIR en un recibo PDF. Por favor revisa el archivo adjunto para ver tu usuario y clave."
              const url = `https://wa.me/${num}?text=${encodeURIComponent(texto)}`
              window.open(url, "_blank")
            } else {
              alert("El cliente no tiene un número de celular válido.")
            }
          } else if (action === "del") {
            CLIENTS = CLIENTS.filter(x => x.id !== id)
            saveClients(CLIENTS)
            renderClients()
          }
        })
      })
    }

    clientSaveBtn.addEventListener("click", e => {
      e.preventDefault()
      const id = Number(clientIdEl.value || 0)
      const nombre = clientNombreEl.value.trim()
      const apellido = clientApellidoEl.value.trim()
      const cedula = clientCedulaEl.value.trim()
      const email = clientEmailEl.value.trim()
      const direccion = clientDireccionEl.value.trim()
      const celular = clientCelularEl.value.trim()
      const tipo = clientTipoEl.value
      const portalPass = clientPortalPassEl ? clientPortalPassEl.value : ""
      const zona = clientZonaEl.value.trim()
      if (!nombre || !apellido || !cedula || !celular || !tipo) {
        alert("Completa al menos nombre, apellido, cédula, celular y tipo de cliente.")
        return
      }
      let finalId = id
      if (id) {
        const idx = CLIENTS.findIndex(x => x.id === id)
        if (idx >= 0) {
          const prev = CLIENTS[idx]
          CLIENTS[idx] = {
            id,
            nombre,
            apellido,
            cedula,
            email,
            direccion,
            celular,
            tipo,
            zona,
            pedidos: typeof prev.pedidos === "number" ? prev.pedidos : 0,
            interesado: prev.interesado === true
          }
        }
      } else {
        const newId = CLIENTS.length ? Math.max(...CLIENTS.map(x => x.id)) + 1 : 1
        finalId = newId
        CLIENTS.push({ id: newId, nombre, apellido, cedula, email, direccion, celular, tipo, zona, pedidos: 0, interesado: true })
      }
      saveClients(CLIENTS)
      if (finalId && portalPass) {
        try {
          fetchAdmin("/api/portal/admin/set-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ clientId: finalId, password: portalPass })
          }).then(r => r.json()).then(data => {
            if (!data || !data.ok) {
              alert("No se pudo actualizar la clave del portal para este cliente.")
            }
          }).catch(() => {
            alert("Error de red al actualizar la clave del portal.")
          })
        } catch {}
      }
      renderClients()
      clientFormEl.reset()
      clientIdEl.value = ""
    })

    clientResetBtn.addEventListener("click", () => {
      clientFormEl.reset()
      clientIdEl.value = ""
    })

    clientTypeFilterEl.addEventListener("change", renderClients)
    clientSearchEl.addEventListener("input", renderClients)

    function exportClientsToCsv() {
      const headers = ["Nombre", "Apellido", "Cédula", "Email", "Dirección", "Zona", "Celular", "Tipo", "Pedidos", "Estado", "Portal"]
      const lines = []
      lines.push(headers.join(";"))
      for (const c of CLIENTS) {
        let portalLabel = "Sin portal"
        if (c.portalApproved) {
          portalLabel = "Aprobado"
          if (typeof c.portalLoginCount === "number" && c.portalLoginCount > 0) {
            portalLabel += ` (${c.portalLoginCount} login${c.portalLoginCount > 1 ? "s" : ""})`
          }
        } else if (c.portalRequestedAt) {
          portalLabel = "Pendiente"
        }
        const row = [
          c.nombre || "",
          c.apellido || "",
          c.cedula || "",
          c.email || "",
          c.direccion || "",
          c.zona || "",
          c.celular || "",
          c.tipo || "",
          typeof c.pedidos === "number" ? c.pedidos : 0,
          c.pedidos && c.pedidos > 0 ? "Con pedidos" : (c.interesado ? "Interesado" : "Sin actividad"),
          portalLabel
        ].map(v => {
          const s = String(v).replace(/"/g, '""')
          return `"${s}"`
        })
        lines.push(row.join(";"))
      }
      const csv = lines.join("\n")
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" })
      const url = URL.createObjectURL(blob)
      const a = document.createElement("a")
      a.href = url
      a.download = "clientes.csv"
      a.click()
      URL.revokeObjectURL(url)
    }

    exportClientsBtn.addEventListener("click", exportClientsToCsv)

    const logoUpload = document.getElementById("logo-upload")
    const adminLogo = document.getElementById("admin-logo")
    if (adminLogo) {
      const customLogo = localStorage.getItem("company_logo")
      if (customLogo) adminLogo.src = customLogo
      adminLogo.onload = () => adminLogo.classList.remove("hidden")
    }
  </script>
</body>
</html>
