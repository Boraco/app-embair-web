<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM Seguimiento - EMBAIR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    .kanban-col { min-height: 500px; }
    .ghost-card { opacity: 0.5; background: #f3f4f6; border: 2px dashed #cbd5e1; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-white shadow z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/admin" class="text-gray-500 hover:text-gray-900">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-xl font-bold text-gray-800">Tablero de Seguimiento</h1>
      </div>
      <div class="flex gap-4 text-sm">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-orange-100 border border-orange-500"></span> Web
            <span class="w-3 h-3 rounded-full bg-green-100 border border-green-500"></span> WhatsApp
            <span class="w-3 h-3 rounded-full bg-yellow-100 border border-yellow-500"></span> MercadoLibre
            <span class="w-3 h-3 rounded-full bg-blue-100 border border-blue-500"></span> Marketplace
        </div>
      </div>
    </div>
  </header>

  <!-- Kanban Board -->
  <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
    <div class="flex gap-6 h-full min-w-[1500px]">
      
      <!-- Col 1: Nuevos / Leads -->
      <div class="flex-1 flex flex-col bg-gray-100 rounded-xl shadow-sm border border-gray-200">
        <div class="p-4 border-b border-gray-200 bg-white rounded-t-xl sticky top-0">
          <h2 class="font-bold text-gray-700 flex justify-between">
            Nuevos Leads
            <span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full text-xs" id="count-new">0</span>
          </h2>
        </div>
        <div id="col-new" class="kanban-col p-3 flex-1 overflow-y-auto space-y-3" data-status="new">
          <!-- Cards go here -->
        </div>
      </div>

      <!-- Col 2: Pedidos Recibidos -->
      <div class="flex-1 flex flex-col bg-blue-50 rounded-xl shadow-sm border border-blue-100">
        <div class="p-4 border-b border-blue-100 bg-white rounded-t-xl sticky top-0">
          <h2 class="font-bold text-blue-800 flex justify-between">
            Recibidos
            <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs" id="count-received">0</span>
          </h2>
        </div>
        <div id="col-received" class="kanban-col p-3 flex-1 overflow-y-auto space-y-3" data-status="received"></div>
      </div>

      <!-- Col 3: En Proceso -->
      <div class="flex-1 flex flex-col bg-orange-50 rounded-xl shadow-sm border border-orange-100">
        <div class="p-4 border-b border-orange-100 bg-white rounded-t-xl sticky top-0">
          <h2 class="font-bold text-orange-800 flex justify-between">
            En Proceso
            <span class="bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full text-xs" id="count-processing">0</span>
          </h2>
        </div>
        <div id="col-processing" class="kanban-col p-3 flex-1 overflow-y-auto space-y-3" data-status="processing"></div>
      </div>

      <!-- Col 4: Listo / Despacho -->
      <div class="flex-1 flex flex-col bg-blue-50 rounded-xl shadow-sm border border-blue-100">
        <div class="p-4 border-b border-blue-100 bg-white rounded-t-xl sticky top-0">
          <h2 class="font-bold text-blue-800 flex justify-between">
            Listo / Despacho
            <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs" id="count-ready">0</span>
          </h2>
        </div>
        <div id="col-ready" class="kanban-col p-3 flex-1 overflow-y-auto space-y-3" data-status="ready"></div>
      </div>

      <!-- Col 5: Completado -->
      <div class="flex-1 flex flex-col bg-green-50 rounded-xl shadow-sm border border-green-100">
        <div class="p-4 border-b border-green-100 bg-white rounded-t-xl sticky top-0">
          <h2 class="font-bold text-green-800 flex justify-between">
            Completado
            <span class="bg-green-100 text-green-600 px-2 py-0.5 rounded-full text-xs" id="count-completed">0</span>
          </h2>
        </div>
        <div id="col-completed" class="kanban-col p-3 flex-1 overflow-y-auto space-y-3" data-status="completed"></div>
      </div>

    </div>
  </main>

  <!-- Modal Detalle -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
      <div class="p-6">
        <div class="flex justify-between items-start mb-6">
          <div>
            <h2 class="text-2xl font-bold text-gray-800" id="modal-title">Pedido #123</h2>
            <p class="text-sm text-gray-500" id="modal-date">Fecha: 12/12/2025</p>
          </div>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-6">
          <div class="bg-gray-50 p-4 rounded-lg">
            <h3 class="font-semibold text-gray-700 mb-2">Cliente</h3>
            <p id="modal-client-name" class="font-medium"></p>
            <p id="modal-client-contact" class="text-sm text-gray-600"></p>
            <p id="modal-client-source" class="text-xs mt-2 px-2 py-1 bg-gray-200 inline-block rounded"></p>
          </div>
          <div class="bg-gray-50 p-4 rounded-lg">
            <h3 class="font-semibold text-gray-700 mb-2">Envío y Pago</h3>
            <p><span class="text-gray-500 text-sm">Método:</span> <span id="modal-delivery" class="font-medium"></span></p>
            <p><span class="text-gray-500 text-sm">Pago:</span> <span id="modal-payment" class="font-medium"></span></p>
            <p class="mt-2 text-sm italic text-gray-600" id="modal-notes"></p>
          </div>
        </div>

        <div class="mb-6">
          <h3 class="font-semibold text-gray-700 mb-3">Productos</h3>
          <div class="border rounded-lg overflow-hidden">
            <table class="w-full text-sm text-left">
              <thead class="bg-gray-100 text-gray-600">
                <tr>
                  <th class="px-4 py-2">Producto</th>
                  <th class="px-4 py-2 text-center">Cant.</th>
                  <th class="px-4 py-2 text-right">Precio</th>
                  <th class="px-4 py-2 text-right">Total</th>
                </tr>
              </thead>
              <tbody id="modal-items" class="divide-y divide-gray-100"></tbody>
              <tfoot class="bg-gray-50 font-bold">
                <tr>
                  <td colspan="3" class="px-4 py-2 text-right">Total:</td>
                  <td class="px-4 py-2 text-right" id="modal-total"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <div class="flex justify-end gap-3">
          <button onclick="deleteOrder()" class="px-4 py-2 text-red-600 hover:bg-red-50 rounded border border-red-200">Eliminar</button>
          <button onclick="closeModal()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ORDERS = []
    let currentOrderId = null

    function getAdminToken() {
      try {
        const saved = localStorage.getItem("admin_token")
        if (saved) return saved
      } catch {}
      return ""
    }

    async function fetchAdmin(path, options) {
      const token = getAdminToken()
      const baseHeaders = options && options.headers ? options.headers : {}
      const headers = token ? { ...baseHeaders, "Authorization": "Basic " + token } : baseHeaders
      const res = await fetch(path, { ...(options || {}), headers })
      if (res.status !== 401 && res.status !== 403) return res
      const newToken = prompt("Credenciales requeridas. Ingrese user:pass:")
      if (!newToken) return res
      try { localStorage.setItem("admin_token", btoa(newToken)) } catch {}
      const headers2 = { ...baseHeaders, "Authorization": "Basic " + btoa(newToken) }
      return fetch(path, { ...(options || {}), headers: headers2 })
    }

    async function loadOrders() {
      try {
        const res = await fetchAdmin("/api/crm/orders")
        if (res.ok) {
            ORDERS = await res.json()
            renderBoard()
        }
      } catch (e) {
        console.error("Error loading orders", e)
      }
    }

    function renderBoard() {
      // Clear cols
      ["new", "received", "processing", "ready", "completed"].forEach(s => {
        document.getElementById("col-" + s).innerHTML = ""
        document.getElementById("count-" + s).textContent = "0"
      })

      ORDERS.forEach(order => {
        const col = document.getElementById("col-" + (order.status || "new"))
        if (col) {
          const card = createCard(order)
          col.appendChild(card)
        }
      })

      // Update counts
      ["new", "received", "processing", "ready", "completed"].forEach(s => {
         const count = document.getElementById("col-" + s).children.length
         document.getElementById("count-" + s).textContent = count
      })
    }

    function createCard(order) {
      const div = document.createElement("div")
      div.className = "bg-white p-4 rounded-lg shadow-sm border border-slate-200 cursor-move hover:shadow-md transition-all group relative select-none"
      div.setAttribute("data-id", order.id)
      
      const sourceMap = {
        "web": { bg: "bg-orange-100", text: "text-orange-800", label: "Web / Links" },
        "whatsapp": { bg: "bg-green-100", text: "text-green-800", label: "WhatsApp" },
        "mercadolibre": { bg: "bg-yellow-100", text: "text-yellow-800", label: "MercadoLibre" },
        "marketplace": { bg: "bg-blue-100", text: "text-blue-800", label: "Marketplace" },
        "google": { bg: "bg-red-100", text: "text-red-800", label: "Google" },
        "email": { bg: "bg-gray-100", text: "text-gray-800", label: "Email" }
      }
      
      const src = sourceMap[order.source || "web"] || sourceMap["web"]

      const date = new Date(order.createdAt).toLocaleDateString()
      const time = new Date(order.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})

      // Format payment and delivery info
      const payment = order.paymentMethod || "A convenir"
      const delivery = order.deliveryMethod || "A convenir"
      const zone = order.client.zona || ""
      const address = order.client.address || ""
      const location = zone ? `${zone} - ${address}` : address

      div.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full ${src.bg} ${src.text}">${src.label}</span>
          <span class="text-xs text-slate-400">${date} ${time}</span>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 line-clamp-1">${order.client.name || "Cliente Anónimo"}</h3>
        <p class="text-xs text-slate-500 mb-2 line-clamp-1">${order.client.phone || "Sin contacto"}</p>
        
        <div class="space-y-1 mb-3 bg-slate-50 p-2 rounded text-xs text-slate-600">
            <div class="flex items-start gap-1">
                <span class="font-semibold w-16 shrink-0">Ubicación:</span>
                <span class="line-clamp-2" title="${location}">${location || "-"}</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="font-semibold w-16 shrink-0">Entrega:</span>
                <span>${delivery}</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="font-semibold w-16 shrink-0">Pago:</span>
                <span>${payment}</span>
            </div>
        </div>

        <div class="flex justify-between items-center border-t pt-2">
          <span class="font-bold text-slate-700">$${Number(order.total).toLocaleString("es-AR")}</span>
          <button onclick="openModal('${order.id}')" class="text-xs text-blue-600 hover:bg-blue-50 px-2 py-1 rounded">Ver Detalle</button>
        </div>
      `
      return div
    }

    function openModal(id) {
      currentOrderId = id
      const order = ORDERS.find(o => o.id === id)
      if (!order) return

      document.getElementById("modal-title").textContent = "Pedido #" + order.id.slice(-6)
      document.getElementById("modal-date").textContent = new Date(order.createdAt).toLocaleString()
      document.getElementById("modal-client-name").textContent = order.client.name || "Sin nombre"
      document.getElementById("modal-client-contact").textContent = (order.client.phone || "") + " - " + (order.client.email || "")
      document.getElementById("modal-client-source").textContent = "Fuente: " + (order.source || "Web")
      
      document.getElementById("modal-delivery").textContent = order.deliveryMethod || "-"
      document.getElementById("modal-payment").textContent = order.paymentMethod || "-"
      document.getElementById("modal-notes").textContent = order.notes ? `"${order.notes}"` : ""
      
      const tbody = document.getElementById("modal-items")
      tbody.innerHTML = ""
      
      ;(order.items || []).forEach(item => {
        const tr = document.createElement("tr")
        tr.innerHTML = `
          <td class="px-4 py-2">
            <div class="font-medium text-slate-800">${item.name}</div>
            <div class="text-xs text-slate-400">${item.code || ""}</div>
          </td>
          <td class="px-4 py-2 text-center">${item.qty}</td>
          <td class="px-4 py-2 text-right">$${Number(item.price).toLocaleString("es-AR")}</td>
          <td class="px-4 py-2 text-right font-medium">$${(item.price * item.qty).toLocaleString("es-AR")}</td>
        `
        tbody.appendChild(tr)
      })
      
      document.getElementById("modal-total").textContent = "$" + Number(order.total).toLocaleString("es-AR")
      document.getElementById("detail-modal").classList.remove("hidden")
      document.getElementById("detail-modal").classList.add("flex")
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.add("hidden")
      document.getElementById("detail-modal").classList.remove("flex")
      currentOrderId = null
    }

    async function updateStatus(id, newStatus) {
      try {
        await fetchAdmin("/api/crm/orders/" + id, {
          method: "PUT",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status: newStatus })
        })
      } catch(e) { console.error(e) }
    }

    async function deleteOrder() {
      if (!confirm("¿Seguro que deseas eliminar este pedido?")) return
      if (!currentOrderId) return
      
      try {
        await fetchAdmin("/api/crm/orders/" + currentOrderId, { method: "DELETE" })
        closeModal()
        loadOrders()
      } catch(e) { alert("Error al eliminar") }
    }

    // Initialize Sortable
    ["new", "received", "processing", "ready", "completed"].forEach(id => {
      new Sortable(document.getElementById("col-" + id), {
        group: "kanban",
        animation: 150,
        ghostClass: "ghost-card",
        onEnd: function (evt) {
          const itemEl = evt.item;
          const newStatus = evt.to.getAttribute("data-status")
          const orderId = itemEl.getAttribute("data-id")
          
          // Only update if moved to a different list
          if (orderId && newStatus && evt.from !== evt.to) {
             // Optimistic update handled by Sortable moving DOM, but we need to update data
             // We reload orders to ensure consistency or just update local
             updateStatus(orderId, newStatus)
          }
        }
      })
    })

    loadOrders()
    // Poll every 30s
    setInterval(loadOrders, 30000)
  </script>
</body>
</html>
