<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador | Distribución EMBAIR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<header class="bg-emerald-900 text-white"><div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"><div><p class="text-xs uppercase tracking-[.18em] text-emerald-200">Distribución</p><h1 class="text-xl font-bold">Cotizador interno</h1></div><a href="/admin.html" class="text-sm border border-white/30 rounded-lg px-3 py-2">Panel principal</a></div></header>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
<section class="bg-white border border-slate-200 rounded-xl p-5"><div class="grid md:grid-cols-[1fr_1fr_auto] gap-3 items-end"><label class="text-sm font-semibold">Cliente<select id="client" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"><option value="">Seleccionar cliente...</option></select></label><label class="text-sm font-semibold">Buscar producto<input id="search" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal" placeholder="Nombre, código o marca"></label><label class="text-sm font-semibold">Descuento %<input id="discount" type="number" min="0" max="100" value="0" class="mt-1 w-28 border rounded-lg px-3 py-2 font-normal"></label></div></section>
<section class="grid lg:grid-cols-[1fr_380px] gap-6 items-start"><div class="bg-white border border-slate-200 rounded-xl p-5"><h2 class="font-bold text-lg mb-4">Productos</h2><div id="products" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></div></div><aside class="bg-white border border-slate-200 rounded-xl p-5 lg:sticky lg:top-4"><h2 class="font-bold text-lg mb-4">Cotización</h2><div id="items" class="space-y-3"><p class="text-sm text-slate-400">Agrega productos para comenzar.</p></div><div class="border-t mt-4 pt-4 space-y-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><strong id="subtotal">$0,00</strong></div><div class="flex justify-between text-red-600"><span>Descuento</span><strong id="discountValue">-$0,00</strong></div><div class="flex justify-between text-lg border-t pt-2"><span>Total</span><strong id="total">$0,00</strong></div></div><textarea id="notes" class="w-full border rounded-lg px-3 py-2 mt-4 text-sm" rows="3" placeholder="Notas de la cotización"></textarea><button id="save" class="w-full mt-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg py-3 font-bold">Guardar cotización</button><p id="message" class="text-sm mt-3"></p></aside></section>
<section class="bg-white border border-slate-200 rounded-xl p-5"><h2 class="font-bold text-lg mb-4">Inventario por empaques</h2><div class="grid md:grid-cols-[2fr_1fr_1fr_1fr_auto] gap-3 items-end"><label class="text-sm font-semibold">Producto<select id="inventoryProduct" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"><option value="">Seleccionar...</option></select></label><label class="text-sm font-semibold">Movimiento<select id="inventoryType" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"><option value="in">Entrada</option><option value="out">Salida</option></select></label><label class="text-sm font-semibold">Paquetes<input id="inventoryQty" type="number" min="1" value="1" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal"></label><label class="text-sm font-semibold">Motivo<input id="inventoryReason" class="mt-1 w-full border rounded-lg px-3 py-2 font-normal" placeholder="Compra, venta..."></label><button id="inventorySave" class="bg-emerald-700 text-white rounded-lg px-4 py-2 font-bold">Registrar</button></div><div id="inventoryMessage" class="text-sm mt-3"></div><div class="overflow-x-auto mt-5"><table class="w-full text-sm"><thead class="border-b text-left"><tr><th class="py-2">Producto</th><th>Paquetes</th><th>Unidades</th></tr></thead><tbody id="inventoryRows"></tbody></table></div></section>
<section class="bg-white border border-slate-200 rounded-xl p-5"><div class="flex items-center justify-between mb-3"><h2 class="font-bold text-lg">Cotizaciones recientes</h2><button id="refresh" class="text-sm text-emerald-700 font-semibold">Actualizar</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="border-b text-left"><tr><th class="py-2">Código</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th class="text-right">Total</th></tr></thead><tbody id="quotes"></tbody></table></div></section>
</main>
<script>
let clients = [], products = [], cart = []
const $ = id => document.getElementById(id)
const money = value => "$" + Number(value || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
function token() { try { return localStorage.getItem("admin_token") || "" } catch { return "" } }
async function api(path, options = {}) { const headers = { ...(options.headers || {}), ...(token() ? { Authorization: "Basic " + token() } : {}) }; let res = await fetch(path, { ...options, headers }); if (res.status === 401 || res.status === 403) { const input = prompt("Credenciales admin (usuario:clave):"); if (input) { const next = btoa(input); localStorage.setItem("admin_token", next); res = await fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: "Basic " + next } }) } } return res }
function selectedClient() { const item = clients.find(c => String(c.id) === $("client").value); return item ? { id: item.id, name: `${item.nombre || ""} ${item.apellido || ""}`.trim() || item.email || "Cliente", email: item.email || "", phone: item.celular || "", zona: item.zona || "", tipo: item.tipo || "" } : null }
function renderProducts() { const q = $("search").value.toLowerCase(); const list = products.filter(p => `${p.name || ""} ${p.code || ""} ${p.brand || ""}`.toLowerCase().includes(q)); $("products").innerHTML = list.map(p => `<article class="border rounded-lg p-3"><div class="font-semibold text-sm line-clamp-2">${p.name || "Producto"}</div><div class="text-xs text-slate-500 mt-1">${p.code || p.brand || ""}</div><div class="flex items-center justify-between mt-3 gap-2"><strong>${p.price == null ? "Cotizar" : money(p.price)}</strong><button data-add="${p.id}" class="bg-emerald-700 text-white rounded px-3 py-1 text-xs font-bold">Agregar</button></div></article>`).join("") || `<p class="text-sm text-slate-400">No hay coincidencias.</p>`; document.querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => add(Number(btn.dataset.add))) }
function add(id) { const p = products.find(x => Number(x.id) === id); if (!p) return; const item = cart.find(x => x.productId === id); if (item) item.qty += 1; else cart.push({ productId: id, name: p.name || "Producto", qty: 1, unitPrice: p.price == null ? 0 : Number(p.price) }); renderCart() }
function renderCart() { const subtotal = cart.reduce((sum, x) => sum + x.qty * x.unitPrice, 0); const percent = Math.min(100, Math.max(0, Number($("discount").value || 0))); const discount = subtotal * percent / 100; $("subtotal").textContent = money(subtotal); $("discountValue").textContent = "-" + money(discount); $("total").textContent = money(subtotal - discount); $("items").innerHTML = cart.length ? cart.map((x, i) => `<div class="border-b pb-2"><div class="flex justify-between gap-2"><strong class="text-sm">${x.name}</strong><button data-remove="${i}" class="text-red-600 text-xs">Quitar</button></div><div class="flex items-center justify-between mt-2 text-xs"><span>${money(x.unitPrice)} c/u</span><input data-qty="${i}" type="number" min="1" value="${x.qty}" class="w-16 border rounded px-2 py-1"></div></div>`).join("") : `<p class="text-sm text-slate-400">Agrega productos para comenzar.</p>`; document.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { cart.splice(Number(b.dataset.remove), 1); renderCart() }); document.querySelectorAll("[data-qty]").forEach(i => i.onchange = () => { cart[Number(i.dataset.qty)].qty = Math.max(1, Number(i.value || 1)); renderCart() }) }
async function load() { const [cr, pr, qr, ir] = await Promise.all([api("/api/clients"), fetch("/api/products"), api("/api/admin/distribution/quotes"), api("/api/admin/distribution/inventory")]); clients = cr.ok ? await cr.json() : []; products = pr.ok ? await pr.json() : []; const data = qr.ok ? await qr.json() : { quotes: [] }; const inventory = ir.ok ? await ir.json() : { products: [] }; $("client").innerHTML = '<option value="">Seleccionar cliente...</option>' + clients.map(c => `<option value="${c.id}">${`${c.nombre || ""} ${c.apellido || ""}`.trim() || c.email || "Cliente"}</option>`).join(""); $("inventoryProduct").innerHTML = '<option value="">Seleccionar...</option>' + products.map(p => `<option value="${p.id}">${p.name || "Producto"}</option>`).join(""); renderProducts(); renderCart(); renderQuotes(data.quotes || []); renderInventory(inventory.products || []) }
function renderInventory(list) { $("inventoryRows").innerHTML = list.map(p => `<tr class="border-t"><td class="py-2">${p.name}</td><td>${p.packages}</td><td>${p.units}</td></tr>`).join("") || `<tr><td colspan="3" class="py-4 text-center text-slate-400">Sin inventario inicial.</td></tr>` }
function renderQuotes(list) { $("quotes").innerHTML = list.map(q => `<tr class="border-t"><td class="py-2 font-mono">${q.id}</td><td>${q.client?.name || "-"}</td><td>${new Date(q.createdAt).toLocaleDateString("es-AR")}</td><td>${q.status}</td><td class="text-right font-semibold">${money(q.total)}</td></tr>`).join("") || `<tr><td colspan="5" class="py-4 text-center text-slate-400">Aún no hay cotizaciones.</td></tr>` }
$("search").oninput = renderProducts; $("discount").oninput = renderCart; $("refresh").onclick = load; $("save").onclick = async () => { const client = selectedClient(); if (!client || !cart.length) { $("message").textContent = "Selecciona un cliente y agrega al menos un producto."; $("message").className = "text-sm mt-3 text-red-600"; return } const res = await api("/api/admin/distribution/quotes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ client, items: cart, discountPercent: Number($("discount").value || 0), notes: $("notes").value }) }); if (res.ok) { $("message").textContent = "Cotización guardada correctamente."; $("message").className = "text-sm mt-3 text-emerald-700"; cart = []; $("notes").value = ""; renderCart(); load() } else { $("message").textContent = "No se pudo guardar la cotización."; $("message").className = "text-sm mt-3 text-red-600" } }
$("inventorySave").onclick = async () => { const productId = Number($("inventoryProduct").value); const res = await api("/api/admin/distribution/inventory/movements", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ productId, type: $("inventoryType").value, quantity: Number($("inventoryQty").value || 0), reason: $("inventoryReason").value }) }); if (res.ok) { $("inventoryMessage").textContent = "Movimiento registrado."; $("inventoryMessage").className = "text-sm mt-3 text-emerald-700"; $("inventoryReason").value = ""; load() } else { const data = await res.json().catch(() => ({})); $("inventoryMessage").textContent = data.error === "insufficient_stock" ? "No hay stock suficiente." : "No se pudo registrar el movimiento."; $("inventoryMessage").className = "text-sm mt-3 text-red-600" } }
load()
</script>
</body>
</html>
