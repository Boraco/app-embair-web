<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar Lista de Precios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
  <body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white/90 backdrop-blur p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-100">
    <div class="text-center mb-6">
      <div class="mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 overflow-hidden border border-slate-200">
        <img src="/uploads/logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
        <span class="text-2xl font-bold text-slate-400" style="display:none">ME</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Descargar lista de precios</h1>
      <p class="text-slate-600 text-sm mt-2">Completa tus datos para recibir el archivo desde la tienda oficial.</p>
    </div>

    <form id="download-form" class="space-y-4">
      <!-- Hidden fields -->
      <input type="hidden" id="pdf-url">
      <input type="hidden" id="campaign-id">
      <input type="hidden" id="catalog-id">

      <div>
        <label class="block text-sm font-medium text-slate-700">Correo electrónico</label>
        <input type="email" id="email" required class="mt-1 block w-full bg-slate-100 border border-slate-300 rounded-md shadow-sm py-2 px-3 text-slate-500 sm:text-sm" readonly>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Nombre *</label>
          <input type="text" id="nombre" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Apellido *</label>
          <input type="text" id="apellido" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Celular / WhatsApp *</label>
        <input type="tel" id="celular" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Ej: 099123456">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Cédula / RIF *</label>
        <input type="text" id="cedula" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Tipo de cliente *</label>
        <select id="tipo" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          <option value="">Selecciona una opción...</option>
          <option value="Instalador">Instalador</option>
          <option value="Ingeniero">Ingeniero</option>
          <option value="Revendedor">Revendedor</option>
          <option value="Particular">Particular</option>
          <option value="Empresa">Empresa</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Zona / ciudad *</label>
        <input type="text" id="zona" required class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
      </div>

      <button type="submit" id="submit-btn" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Confirmar y descargar
      </button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SESSION_KEY = "embair_session_id"
      function getSessionId() {
        try {
          const existing = localStorage.getItem(SESSION_KEY)
          if (existing) return existing
          const id = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36)
          localStorage.setItem(SESSION_KEY, id)
          return id
        } catch {
          return ""
        }
      }

      async function trackEvent(type, meta, emailOverride) {
        try {
          await fetch("/api/events", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              type,
              sessionId: getSessionId(),
              email: typeof emailOverride === "string" ? emailOverride : "",
              meta: meta || {}
            })
          })
        } catch {}
      }

      // Parse URL params
      const params = new URLSearchParams(window.location.search)
      const emailParam = params.get("email")
      const cid = params.get("cid")
      const pdf = params.get("pdf")
      const catalogId = params.get("catalogId")

      if (!pdf) {
        alert("Enlace inválido. Falta el archivo PDF.")
        return
      }

      const emailInput = document.getElementById("email")
      if (emailParam) {
        emailInput.value = emailParam
      } else {
        // If no email, make it editable and required
        emailInput.removeAttribute("readonly")
        emailInput.classList.remove("bg-slate-100", "text-slate-500")
        emailInput.classList.add("bg-white", "text-slate-900", "focus:ring-blue-500", "focus:border-blue-500")
      }

      document.getElementById("campaign-id").value = cid || ""
      document.getElementById("pdf-url").value = pdf
      document.getElementById("catalog-id").value = catalogId || ""
      trackEvent("download_page_view", { catalogId: catalogId || "", cid: cid || "" })

      // Handle Submit
      const form = document.getElementById("download-form")
      const btn = document.getElementById("submit-btn")

      form.addEventListener("submit", async (e) => {
        e.preventDefault()
        btn.disabled = true
        btn.textContent = "Guardando..."

        const finalEmail = emailInput.value.trim()
        const catalogIdVal = document.getElementById("catalog-id").value.trim()
        
        const data = {
          email: finalEmail,
          nombre: document.getElementById("nombre").value.trim(),
          apellido: document.getElementById("apellido").value.trim(),
          cedula: document.getElementById("cedula").value.trim(),
          celular: document.getElementById("celular").value.trim(),
          zona: document.getElementById("zona").value.trim(),
          tipo: document.getElementById("tipo").value,
          campaignId: cid || "",
          catalogId: catalogIdVal || "",
          source: "catalog_download",
          sessionId: getSessionId()
        }
        trackEvent("catalog_download_submit", { catalogId: catalogIdVal || "", cid: cid || "" }, finalEmail)

        try {
          const res = await fetch("/api/public/lead", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "true" 
            },
            body: JSON.stringify(data)
          })

          if (res.ok) {
            trackEvent("catalog_download_allowed", { catalogId: catalogIdVal || "", cid: cid || "" }, finalEmail)
            // Success -> Redirect to PDF
            window.location.href = pdf
          } else {
            trackEvent("catalog_download_blocked", { status: res.status, catalogId: catalogIdVal || "", cid: cid || "" }, finalEmail)
            alert("Hubo un error al guardar los datos. Intenta nuevamente.")
            btn.disabled = false
            btn.textContent = "Confirmar y Descargar"
          }
        } catch (err) {
          console.error(err)
          trackEvent("catalog_download_error", { catalogId: catalogIdVal || "", cid: cid || "" }, finalEmail)
          alert("Error de conexión. Intenta nuevamente.")
          btn.disabled = false
          btn.textContent = "Confirmar y Descargar"
        }
      })
    })
  </script>
</body>
</html>
