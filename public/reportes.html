<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reportes de Ventas - EMBAIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/admin" class="text-slate-500 hover:text-slate-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h1 class="text-xl font-bold text-slate-800">Reportes de Ventas</h1>
            </div>
            <div>
                <select id="time-range" class="bg-slate-100 border-none text-sm rounded-lg px-3 py-2 text-slate-600 font-medium focus:ring-2 focus:ring-blue-500">
                    <option value="all">Todo el historial</option>
                    <option value="30">Últimos 30 días</option>
                    <option value="7">Últimos 7 días</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <!-- Total Ventas -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="p-2 bg-green-50 text-green-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Ingresos Totales</span>
                </div>
                <h3 class="text-2xl font-bold text-slate-800" id="kpi-total-revenue">$0</h3>
                <p class="text-sm text-slate-500 mt-1" id="kpi-orders-count">0 pedidos</p>
            </div>

            <!-- Ticket Promedio -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Ticket Promedio</span>
                </div>
                <h3 class="text-2xl font-bold text-slate-800" id="kpi-avg-ticket">$0</h3>
                <p class="text-sm text-green-600 mt-1 font-medium">Por pedido</p>
            </div>

            <!-- Tasa de Conversión (Leads vs Completados) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="p-2 bg-orange-50 text-orange-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    </div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Conversión</span>
                </div>
                <h3 class="text-2xl font-bold text-slate-800" id="kpi-conversion">0%</h3>
                <p class="text-sm text-slate-500 mt-1">Completados vs Total</p>
            </div>

            <!-- Productos Vendidos -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="p-2 bg-orange-50 text-orange-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    </div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Volumen</span>
                </div>
                <h3 class="text-2xl font-bold text-slate-800" id="kpi-items-sold">0</h3>
                <p class="text-sm text-slate-500 mt-1">Unidades vendidas</p>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Ventas por Canal -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-6">Ventas por Canal (Fuente)</h3>
                <div class="h-64 relative">
                    <canvas id="chart-sources"></canvas>
                </div>
            </div>

            <!-- Ventas por Estado -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-6">Estado de los Pedidos</h3>
                <div class="h-64 relative">
                    <canvas id="chart-status"></canvas>
                </div>
            </div>
        </div>

        <!-- Top Products Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100">
                <h3 class="font-bold text-slate-800">Productos Más Vendidos</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase font-bold text-xs">
                        <tr>
                            <th class="px-6 py-3">Producto</th>
                            <th class="px-6 py-3 text-center">Unidades</th>
                            <th class="px-6 py-3 text-right">Ingresos Generados</th>
                        </tr>
                    </thead>
                    <tbody id="top-products-body" class="divide-y divide-slate-100">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let ORDERS = []
        let chartSources = null
        let chartStatus = null

        async function loadData() {
            try {
                const res = await fetch("/api/crm/orders", {
                    headers: { "Authorization": "Basic " + btoa("admin:admin") }
                })
                if (res.ok) {
                    ORDERS = await res.json()
                    processData()
                }
            } catch (e) {
                console.error("Error loading data", e)
            }
        }

        function processData() {
            const range = document.getElementById("time-range").value
            const now = new Date()
            
            // Filter by Date Range
            const filteredOrders = ORDERS.filter(o => {
                if (range === "all") return true
                const date = new Date(o.createdAt)
                const diffTime = Math.abs(now - date)
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24))
                return diffDays <= parseInt(range)
            })

            // --- KPIs ---
            const totalRevenue = filteredOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0)
            const totalOrders = filteredOrders.length
            const avgTicket = totalOrders > 0 ? totalRevenue / totalOrders : 0
            
            const completedOrders = filteredOrders.filter(o => o.status === "completed").length
            const conversionRate = totalOrders > 0 ? (completedOrders / totalOrders) * 100 : 0

            const totalItems = filteredOrders.reduce((sum, o) => {
                return sum + (o.items || []).reduce((s, i) => s + (Number(i.qty) || 0), 0)
            }, 0)

            document.getElementById("kpi-total-revenue").textContent = "$" + totalRevenue.toLocaleString("es-AR")
            document.getElementById("kpi-orders-count").textContent = totalOrders + " pedidos"
            document.getElementById("kpi-avg-ticket").textContent = "$" + Math.round(avgTicket).toLocaleString("es-AR")
            document.getElementById("kpi-conversion").textContent = conversionRate.toFixed(1) + "%"
            document.getElementById("kpi-items-sold").textContent = totalItems

            // --- Charts Data ---
            
            // 1. Sources
            const sources = {}
            filteredOrders.forEach(o => {
                const s = (o.source || "desconocido").toLowerCase()
                sources[s] = (sources[s] || 0) + 1
            })
            
            // 2. Status
            const statusCounts = {}
            filteredOrders.forEach(o => {
                const s = o.status || "new"
                statusCounts[s] = (statusCounts[s] || 0) + 1
            })

            // 3. Top Products
            const products = {}
            filteredOrders.forEach(o => {
                (o.items || []).forEach(i => {
                    const name = i.name || "Sin nombre"
                    if (!products[name]) products[name] = { qty: 0, revenue: 0 }
                    products[name].qty += (Number(i.qty) || 0)
                    products[name].revenue += (Number(i.qty) * Number(i.price) || 0)
                })
            })
            
            const sortedProducts = Object.entries(products)
                .sort((a, b) => b[1].revenue - a[1].revenue)
                .slice(0, 5)

            renderCharts(sources, statusCounts)
            renderTopProducts(sortedProducts)
        }

        function renderCharts(sourcesData, statusData) {
            // Sources Chart
            const ctxSources = document.getElementById("chart-sources").getContext("2d")
            if (chartSources) chartSources.destroy()
            
            const sourceKeys = Object.keys(sourcesData)
            const sourceColors = sourceKeys.map(k => {
                const s = k.toLowerCase()
                if (s.includes("whats")) return "#22c55e" // Verde
                if (s.includes("market")) return "#6366f1" // Azul Medio Morado
                if (s.includes("libre") || s.includes("merca")) return "#eab308" // Amarillo
                if (s.includes("link") || s.includes("web")) return "#f97316" // Naranja
                if (s.includes("mail") || s.includes("correo") || s.includes("camp")) return "#64748b" // Gris
                return "#94a3b8" // Default
            })

            chartSources = new Chart(ctxSources, {
                type: "doughnut",
                data: {
                    labels: sourceKeys.map(k => k.toUpperCase()),
                    datasets: [{
                        data: Object.values(sourcesData),
                        backgroundColor: sourceColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            })

            // Status Chart
            const ctxStatus = document.getElementById("chart-status").getContext("2d")
            if (chartStatus) chartStatus.destroy()
            
            const statusLabels = {
                "new": "Nuevos Leads",
                "received": "Recibidos",
                "processing": "En Proceso",
                "ready": "Listos",
                "completed": "Completados"
            }

            chartStatus = new Chart(ctxStatus, {
                type: "bar",
                data: {
                    labels: Object.keys(statusData).map(k => statusLabels[k] || k),
                    datasets: [{
                        label: "Pedidos",
                        data: Object.values(statusData),
                        backgroundColor: "#3b82f6",
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            })
        }

        function renderTopProducts(products) {
            const tbody = document.getElementById("top-products-body")
            tbody.innerHTML = ""
            
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-slate-400">No hay datos suficientes</td></tr>`
                return
            }

            products.forEach(([name, data]) => {
                const tr = document.createElement("tr")
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${name}</td>
                    <td class="px-6 py-4 text-center text-slate-600">${data.qty}</td>
                    <td class="px-6 py-4 text-right font-bold text-slate-700">$${data.revenue.toLocaleString("es-AR")}</td>
                `
                tbody.appendChild(tr)
            })
        }

        document.getElementById("time-range").addEventListener("change", processData)
        
        loadData()
    </script>
</body>
</html>
